[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lla32-resolver"
version = "0.1.0"
description = "Archival 32-bit Windows LoadLibraryA resolver research spike."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lla32-resolve = "lla32_resolver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
